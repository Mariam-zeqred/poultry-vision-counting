[project]
name = "poultry-vision"
version = "0.1.0"
description = "Count birds in poultry images with a pre-trained COCO detector, build density heatmaps, raise smart-poultry-farm vision alerts."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
